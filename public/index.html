<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #dfe9f3, #ffffff);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chat-container {
        width: 100%;
        max-width: 500px;
        height: 600px;
        background-color: white;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        border-radius: 15px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #messages {
        flex: 1;
        list-style: none;
        padding: 20px;
        margin: 0;
        overflow-y: auto;
        border-top: 1px solid #dee2e6;
        border-bottom: 1px solid #dee2e6;
      }
      #messages li {
        background: #f1f1f1;
        padding: 10px 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        max-width: 80%;
        word-wrap: break-word;
      }
      form {
        padding: 15px;
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="bg-primary text-white text-center py-3">
        <h4 class="mb-0">💬 Real-Time Chat</h4>
      </div>
      <input
        type="text"
        id="username"
        placeholder="enter user name"
        required
      />
      <ul id="messages"></ul>

      <form id="chat-form">
        <input
          type="text"
          id="chat-id"
          class="form-control"
          placeholder="Type your message..."
          required
        />
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const usernameinput = document.getElementById("username");
      const form = document.getElementById("chat-form");
      const messageList = document.getElementById("messages");
      const input = document.getElementById("chat-id");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const user = usernameinput.value.trim();
        const msg = input.value.trim();

        if (!user || !msg) return;

        socket.emit("chat message", {user,msg}); // Corrected event name
        input.value = "";
      });

      socket.on("chat message", ({user,msg}) => {
        const li = document.createElement("li");
        li.textContent = `${user}:${msg}`;
        messageList.appendChild(li);
        messageList.scrollTop = messageList.scrollHeight; // Auto-scroll to latest
      });
    </script>
  </body>
</html>
